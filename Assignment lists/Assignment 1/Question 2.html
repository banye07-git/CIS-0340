<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Question 2</title>
        <style>
            table {
                border-collapse: collapse;
                width: 70%;
            }
            
            th, td {
                border: 1px solid black;
                padding: 8px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <table>
            <!-- First level headers: Foods (row label) and Meals (column label) -->
            <tr>
                <th rowspan="2">Foods</th>
                <th colspan="3">Meals</th>
            </tr>
            <!-- Second level headers: Breakfast, Lunch, Dinner -->
            <tr>
                <th>Breakfast</th>
                <th>Lunch</th>
                <th>Dinner</th>
            </tr>
            <!-- Data rows: Food categories with gram amounts -->
            <tr>
                <th>Bread</th>
                <td>150g</td>
                <td>200g</td>
                <td>100g</td>
            </tr>
            <tr>
                <th>Main Course</th>
                <td>250g</td>
                <td>300g</td>
                <td>280g</td>
            </tr>
            <tr>
                <th>Vegetable</th>
                <td>120g</td>
                <td>150g</td>
                <td>180g</td>
            </tr>
            <tr>
                <th>Dessert</th>
                <td>75g</td>
                <td>100g</td>
                <td>120g</td>
            </tr>

        </table>
    </body>
</html>
